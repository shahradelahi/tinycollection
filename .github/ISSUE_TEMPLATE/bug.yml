name: 🐞 Bug Report
description: File a bug report to help us improve
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 🙏
  - type: textarea
    id: error-message
    attributes:
      label: 📄 Error Message
      description: Please paste the full error message here.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: ✅ Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: ❌ Actual Behavior
      description: A clear and concise description of what actually happened.
    validations:
      required: true
  - type: textarea
    id: code-snippet
    attributes:
      label: 👨‍💻 Code Snippet to Reproduce
      description: Please provide a minimal code snippet that reproduces the issue.
      render: typescript
    validations:
      required: true
  - type: dropdown
    id: willing-to-pr
    attributes:
      label: 💪 Are you willing to create a PR to fix this issue?
      options:
        - 'Yes'
        - 'No'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 📦 Version
      description: What version of the library are you using?
    validations:
      required: true
